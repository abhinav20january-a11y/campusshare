services:
  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      CLIENT_URL: http://localhost:3000
      DB_HOST: database
      DB_PORT: 3306
      DB_USER: campusshare
      DB_PASSWORD: ${DB_PASSWORD:-campusshare_local_change_me}
      DB_NAME: campusshare
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-before-public-launch-2026}
      DEMO_VERIFICATION: "false"
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
  database:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: campusshare
      MYSQL_USER: campusshare
      MYSQL_PASSWORD: ${DB_PASSWORD:-campusshare_local_change_me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-campusshare_root_change_me}
    volumes:
      - campusshare_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL","mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 4s
      retries: 30
    restart: unless-stopped
volumes:
  campusshare_data:
